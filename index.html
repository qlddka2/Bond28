ko:{h1:"나는 관계에서<br><em>어떻게 마음을 놓는가</em>",hero:"28개의 질문으로 연애와 가까운 관계 속 나의 패턴을 ‘불안’과 ‘거리두기’ 두 축으로 살펴보고, 네 가지 애착유형 중 어디에 가까운지 보여줍니다.",start:"검사 시작",how:"검사 방식",guide:"가장 최근의 연애나 가까운 관계를 떠올리며, 옳은 답이 아니라 평소의 반응에 가깝게 · 약 8~10분 · 문항은 무작위로 섞입니다",ten:"약 10분",prev:"이전",next:"다음",fin:"결과 보기",vm:"ATTACHMENT MAP",vmS:"가운데에서 내 쪽으로 채워진 정도 = 강도 (한쪽 최대 3단계)",yr:"YOUR READ",yrS:"두 축 풀이",ty:"YOUR TYPE",ab:"ABOUT THIS RESULT",abT:"이 검사는 임상 진단이 아닌 자기이해용 도구입니다. 애착유형은 고정된 라벨이 아니라 상대·상황·경험에 따라 달라지는 연속선입니다. 점수는 척도의 중간값(4점)을 기준으로 한 상대 위치이며, 심리적 어려움이 크다면 전문가와 상담해 보세요.",again:"다시 검사",copy:"결과 복사",card:"결과 카드",foot:"BOND 28 · 결과는 서버로 전송하거나 저장하지 않습니다.",sharedTitle:"친구가 BOND 28에서 이 결과를 받았어요",sharedDesc:"나도 같은 검사를 해보고 내 애착유형을 확인해 보세요.",sharedStart:"나도 검사하기",save:"이미지를 길게 눌러 저장하세요",shr:"공유",resume:"이전에 진행하던 검사가 있습니다. 이어서 진행할까요?",bord:"두 축 모두 중심 가까이에 있어 유형 경계에 가깝습니다. 상황에 따라 다른 유형처럼 보일 수 있어요."},
en:{h1:"How do you<br><em>let your guard down</em><br>in relationships?",hero:"28 questions map your pattern in close relationships on two axes, anxiety and distance, and show which of the four attachment styles you lean toward.",start:"Start",how:"How it works",guide:"Think of your most recent romantic or close relationship; answer with your usual reaction, not the right answer · about 8–10 min · questions are shuffled",ten:"~10 min",prev:"Back",next:"Next",fin:"See result",vm:"ATTACHMENT MAP",vmS:"Fill grows from the center toward your side (up to 3 levels per side)",yr:"YOUR READ",yrS:"Two axes",ty:"YOUR TYPE",ab:"ABOUT THIS RESULT",abT:"This is a self-understanding tool, not a clinical diagnosis. Attachment style is a continuum that shifts with partner, situation and experience, not a fixed label. Scores are relative to the scale midpoint (4); if you're struggling, consider talking to a professional.",again:"Retake",copy:"Copy result",card:"Result card",foot:"BOND 28 · Results are never sent or stored on a server.",sharedTitle:"A friend shared their BOND 28 result with you",sharedDesc:"Take the same test and see which attachment style you lean toward.",sharedStart:"Take the test",save:"Press and hold the image to save",shr:"Share",resume:"You have an unfinished test. Continue?",bord:"Both axes are near the center, so you're close to a boundary between types and may look like a different type depending on the situation."},

ja:{h1:"あなたは関係の中で<br><em>どう心を預ける</em>のか?",hero:"28の質問で、親密な関係での傾向を「不安」と「距離」の2軸で見て、4つの愛着タイプのどれに近いかを示します。",start:"診断開始",how:"診断の流れ",guide:"最近の恋愛や親しい関係を思い浮かべ、正解ではなくふだんの反応に近く · 約8〜10分 · 質問はランダム順です",ten:"約10分",prev:"戻る",next:"次へ",fin:"結果を見る",vm:"ATTACHMENT MAP",vmS:"中央から傾いた側へ色が伸びます（片側最大3段階）",yr:"YOUR READ",yrS:"2軸の読み解き",ty:"YOUR TYPE",ab:"ABOUT THIS RESULT",abT:"この診断は自己理解のためのもので、臨床診断ではありません。愛着タイプは固定のラベルではなく、相手・状況・経験で変わる連続体です。点数は尺度の中間値（4点）を基準にした相対位置です。つらさが大きい場合は専門家への相談をご検討ください。",again:"もう一度",copy:"結果をコピー",card:"結果カード",foot:"BOND 28 · 結果はサーバーに送信・保存されません。",sharedTitle:"友だちが BOND 28 の結果をシェアしました",sharedDesc:"同じ診断を受けて、自分の愛着タイプを見てみましょう。",sharedStart:"診断してみる",save:"画像を長押しして保存",shr:"共有",resume:"途中の診断があります。続けますか？",bord:"両軸とも中心に近く、タイプの境界に近い状態です。状況によって別のタイプに見えることもあります。"}};
const SC={ko:["전혀 동의하지 않음","동의하지 않음","약간 동의하지 않음","보통","약간 동의함","동의함","매우 동의함"],en:["Strongly disagree","Disagree","Slightly disagree","Neutral","Slightly agree","Agree","Strongly agree"],zh:["完全不同意","不同意","有点不同意","一般","有点同意","同意","非常同意"],ja:["まったく同意しない","同意しない","やや同意しない","どちらでもない","やや同意する","同意する","とても同意する"]};

const AXD={ko:[["관계에서 쉽게 안심하는 편입니다. 연락이 줄거나 의견이 달라도 관계 자체를 의심하지 않고 기다릴 수 있습니다.","관계의 변화를 민감하게 감지하는 편입니다. 상대의 신호를 잘 읽는 장점이 있지만, 확인을 반복하면 서로 지칠 수 있습니다.","이 축에서는 크게 기울지 않았습니다. 상대와 상황에 따라 달라질 수 있어요."],["가까워지고 기대는 것이 비교적 자연스럽습니다. 속마음을 나누며 안정감을 얻는 편입니다.","혼자 해결하고 자기 공간을 지키는 데 익숙합니다. 자립은 강점이지만 상대에게는 거리감으로 느껴질 수 있습니다.","이 축에서는 크게 기울지 않았습니다. 상대와 상황에 따라 달라질 수 있어요."]],
en:[["You settle easily in relationships; less contact or disagreement doesn't make you doubt the bond.","You sense changes in a relationship quickly. That attunement is a strength, but repeated checking can wear both people out.","Not strongly tilted on this axis; it may vary with the person and situation."],["Getting close and leaning on others feels natural; sharing feelings steadies you.","You're used to handling things alone and guarding your space. Independence is a strength, but it can read as distance.","Not strongly tilted on this axis; it may vary with the person and situation."]],
zh:[["你在关系中容易安心，联系变少或意见不同也不会怀疑关系本身。","你对关系的变化很敏感。善于读懂对方信号是优点，但反复确认可能让双方疲惫。","在这条轴上没有明显倾向，会因对象和情境而变。"],["亲近并依靠他人对你来说较自然，分享心事会让你安定。","你习惯独自解决问题并守住自己的空间。独立是优点，但对方可能感到疏离。","在这条轴上没有明显倾向，会因对象和情境而变。"]],
ja:[["関係の中で安心しやすく、連絡が減ったり意見が違っても関係そのものは疑いません。","関係の変化に敏感です。相手の合図を読む力は強みですが、確認を繰り返すと互いに疲れることがあります。","この軸では大きく偏っておらず、相手や状況で変わりえます。"],["近づいて頼ることが自然で、気持ちを分かち合うと安定します。","一人で解決し自分の空間を守ることに慣れています。自立は強みですが、相手には距離に感じられることもあります。","この軸では大きく偏っておらず、相手や状況で変わりえます。"]]};
const TY={ko:[["안정형","든든한 정박지","가까움도 혼자만의 시간도 편안하게 오가는 유형","불안과 거리두기가 모두 낮은 편입니다. 가까워지는 것도, 각자의 시간을 갖는 것도 비교적 편안하게 받아들이고, 갈등이 생겨도 대화로 풀 수 있다고 믿습니다. 안정적이라고 완벽한 건 아니니, 상대가 다른 유형이라면 그 사람의 불안이나 거리두기를 ‘문제’가 아닌 ‘방식의 차이’로 이해해 주는 것이 큰 힘이 됩니다."],
["불안형","다정한 안테나","가까움을 간절히 원하고, 거리가 생길까 민감한 유형","관계에 깊이 마음을 쓰고 친밀함을 강하게 원하는 반면, 연락이나 태도의 작은 변화에도 거절의 신호를 읽기 쉽습니다. 다정함과 헌신이 강점이지만 확인을 반복하면 서로 지칠 수 있어요. 불안이 올라올 때 바로 확인하기보다 잠깐 멈추고 ‘사실’과 ‘추측’을 나눠 보고, 불안을 비난 대신 부탁(‘늦을 땐 연락 한 번 줘’)으로 전해 보세요."],
["회피형","고요한 등대","독립과 자기 영역을 중시하고, 감정적 거리를 편안해하는 유형","혼자 해결하는 힘이 강하고 자기 공간을 소중히 여기며, 감정 표현이나 의존이 부담스러운 편입니다. 침착함과 자립이 강점이지만 상대에게는 거리감으로 느껴질 수 있어요. 가까워지는 것이 곧 자유를 잃는 것은 아님을 작은 시도로 확인해 보세요. 속마음을 한 줄만 먼저 공유하거나 ‘지금은 혼자 있고 싶어, 나중에 얘기하자’처럼 설명해 주면 오해가 크게 줄어듭니다."],
["두려움-회피형","두 마음의 줄타기","가까워지고 싶지만 다칠까 두려워 망설이는 유형","친밀함을 원하면서도 상처받을까 두려워 다가갔다 물러서기를 반복하기 쉬운 유형입니다. 불안과 거리두기가 함께 높아 스스로도 마음을 알기 어렵게 느껴질 수 있어요. 감정의 폭이 크다는 것은 그만큼 관계를 소중히 여긴다는 뜻이기도 합니다. 마음이 갈릴 때는 ‘지금 나는 가까워지고 싶은가, 도망치고 싶은가’를 말로 정리해 보고, 안전하다고 느껴지는 사람과 작은 신뢰 경험을 쌓아 보세요."]],
en:[["Secure","Safe Harbor","Comfortable moving between closeness and time alone","Low anxiety and low distance. You take closeness and separate time in stride and trust conflicts can be talked through. Being secure isn't being perfect; with a differently wired partner, treating their anxiety or distance as a style difference rather than a flaw helps a lot."],
["Anxious-Preoccupied","Sensitive Antenna","Deeply wants closeness and is alert to any distance","You invest deeply and crave closeness, but small shifts in contact or tone can read as signs of rejection. Warmth and devotion are strengths; repeated checking can tire both sides. Pause to separate facts from guesses, and voice worries as requests ('text me once when you're late') rather than blame."],
["Dismissive-Avoidant","Quiet Lighthouse","Values independence and is at ease with emotional distance","You are self-reliant and protect your space; emotional display and dependence feel like pressure. Composure and independence are strengths but can feel like distance to a partner. Test in small steps that closeness isn't lost freedom: share one line of your feelings first, or explain 'I need time alone, let's talk later'."],
["Fearful-Avoidant","Tightrope Walker","Wants closeness but hesitates for fear of getting hurt","You want intimacy yet fear being hurt, so approaching and pulling back can repeat. High anxiety and high distance together can make your own feelings hard to read. Big feelings also show how much relationships matter. When torn, name it: 'do I want closer or to run?', and build small trust experiences with people who feel safe."]],
zh:[["安全型","安稳的港湾","在亲近与独处之间都自在的类型","焦虑和回避都偏低。能从容面对亲近和各自的时间，相信冲突可以靠沟通化解。安全并不等于完美；若伴侣类型不同，把对方的不安或距离看作“方式不同”而非“问题”，会是很大的支持。"],
["焦虑型","敏感的天线","渴望亲近，对距离格外敏感的类型","你很投入关系、渴望亲密，但联系或语气的小变化容易被解读为被拒绝的信号。温柔与付出是优点，反复确认则可能让双方疲惫。不安出现时先停一下，区分“事实”与“猜测”，并用请求（“晚了请发条消息”）代替指责。"],
["回避型","安静的灯塔","重视独立，对情感距离自在的类型","你善于独自解决问题并守护自己的空间，对情感表达和依赖会有压力。冷静与自立是优点，但对方可能感到疏离。可以用小尝试确认亲近不等于失去自由：先分享一句心里话，或说明“我想一个人待会儿，晚点聊”。"],
["恐惧-回避型","两难的走钢丝者","想亲近又怕受伤而犹豫的类型","你渴望亲密又害怕受伤，容易反复靠近又退开。焦虑与回避同时偏高，自己也可能难以看清心意。情绪起伏大也说明你很珍视关系。心里拉扯时，试着说清“我现在是想靠近，还是想逃开”，并和让你感到安全的人积累小小的信任经验。"]],
ja:[["安定型","頼れる港","近さも一人の時間も心地よく行き来できるタイプ","不安も距離も低めです。親密さも各自の時間も落ち着いて受け止め、衝突も話し合えると信じています。安定は完璧ではありません。タイプの違う相手の不安や距離を「問題」ではなく「やり方の違い」と捉えると大きな支えになります。"],
["不安型","繊細なアンテナ","親密さを強く求め、距離に敏感なタイプ","関係に深く心を注ぎ親密さを求める一方、連絡や口調の小さな変化を拒絶のサインと読みやすい傾向があります。優しさと献身は強みですが、確認を繰り返すと互いに疲れます。不安のときは一度止まり、事実と推測を分け、責めずにお願い（「遅れるときは一言ください」）の形で伝えましょう。"],
["回避型","静かな灯台","自立を重んじ、感情的な距離が心地よいタイプ","一人で解決する力が強く自分の空間を大切にし、感情表現や依存を負担に感じやすいタイプです。冷静さと自立は強みですが、相手には距離に映ることも。近づくことが自由を失うことではないと、小さく試してみましょう。本音を一言先に伝える、「今は一人になりたい、あとで話そう」と説明するだけでも誤解は減ります。"],
["恐れ-回避型","揺れる綱渡り","近づきたいけれど傷つくのが怖くてためらうタイプ","親密さを望みながら傷つくことを恐れ、近づいては離れるを繰り返しやすいタイプです。不安と距離がともに高く、自分の気持ちも分かりにくく感じることがあります。感情の振れ幅は、関係を大切に思う証でもあります。迷うときは「今は近づきたいのか、逃げたいのか」を言葉にし、安心できる人と小さな信頼の経験を重ねましょう。"]]};
const LVW={ko:["","약한","뚜렷한","강한"],en:["","Mild","Clear","Strong"],zh:["","轻微","明显","强烈"],ja:["","弱い","はっきり","強い"]};

const QT={ko:["연락이 평소보다 늦어지면 마음이 불안해져 자꾸 휴대폰을 확인한다.","상대가 나를 떠날까 봐 걱정될 때가 많다.","상대의 표정이나 말투가 조금만 달라져도 내가 뭘 잘못했나 생각한다.","사랑받고 있다는 말을 자주 들어야 안심이 된다.","연애가 깊어질수록 상대보다 내가 더 좋아하는 것 같아 불안하다.","싸운 뒤에는 관계가 끝날까 봐 마음이 오래 가라앉지 않는다.","혼자 있는 시간이 길어지면 외롭고 버려진 기분이 든다.","연락이 뜸해도 별일 없겠거니 하고 편하게 기다린다.","상대가 나를 아낀다는 걸 굳이 확인하지 않아도 믿을 수 있다.","다투더라도 우리 관계는 결국 괜찮을 거라고 생각한다.","상대가 다른 사람과 즐겁게 지내도 질투나 불안이 크지 않다.","혼자 보내는 시간도 불안 없이 잘 즐긴다.","내가 사랑받을 만한 사람이라는 확신이 대체로 있다.","관계에서 불안해져도 스스로 마음을 가라앉히는 편이다.","힘든 일이 있어도 상대에게 기대기보다 혼자 해결하는 편이 편하다.","상대가 너무 가까이 다가오면 부담스러워 거리를 두고 싶어진다.","속마음이나 약한 모습을 보여주는 것이 불편하다.","연애를 해도 나만의 영역은 철저히 지켜야 한다고 생각한다.","감정 표현이 많은 사람 앞에서는 어떻게 대해야 할지 막막하다.","누군가에게 의지하게 되면 자유를 잃는 것 같아 꺼려진다.","관계가 진지해지려 하면 오히려 마음이 식거나 도망치고 싶어진다.","힘들 때 상대에게 털어놓고 기대는 것이 자연스럽다.","가까운 사람과 마음을 나누는 시간이 편하고 좋다.","상대와 일상의 모든 것을 나누는 관계를 원한다.","내 약한 모습을 보여줘도 상대가 받아줄 거라 믿는다.","서로 의지하는 관계가 오히려 더 안정적이라고 느낀다.","연인이 나에게 더 가까워지고 싶어 하면 기쁘다.","관계가 깊어질수록 더 편안해지는 편이다."],
en:["When replies come later than usual, I get anxious and keep checking my phone.","I often worry that my partner might leave me.","If their tone or expression shifts slightly, I wonder what I did wrong.","I need to hear often that I am loved to feel reassured.","As a relationship deepens, I feel I care more than they do, and that scares me.","After a fight, I can't settle down for long, fearing the relationship will end.","When I'm alone for long, I feel lonely and abandoned.","Even if contact thins out, I wait calmly assuming all is fine.","I can trust that my partner cares without needing to check.","Even after arguing, I believe we will be okay in the end.","When my partner enjoys time with others, I don't feel much jealousy or worry.","I enjoy time alone without feeling uneasy.","I am generally confident that I am worthy of love.","When I feel anxious in a relationship, I can usually calm myself down.","Even when things are hard, I'd rather handle them alone than lean on my partner.","When a partner gets too close, I feel pressure and want space.","Showing my inner feelings or vulnerable side makes me uncomfortable.","Even in a relationship, I think I must firmly guard my own space.","I don't know how to respond to people who express lots of emotion.","Depending on someone feels like losing freedom, so I hold back.","When a relationship gets serious, I tend to cool off or want to run.","It feels natural to open up to and lean on my partner when I'm struggling.","I feel at ease and happy sharing my feelings with someone close.","I want a relationship where we share everyday life fully.","I trust my partner would accept me even when I show my weaknesses.","I feel that relying on each other makes a relationship more stable.","I'm glad when my partner wants to get closer to me.","The deeper a relationship gets, the more at ease I feel."],
zh:["对方回复比平时慢时，我会不安，忍不住反复看手机。","我常常担心对方会离开我。","对方的神情或语气稍有变化，我就会想是不是自己做错了什么。","我需要常听到“我爱你”之类的话才能安心。","关系越深，我越觉得自己比对方更投入，因此不安。","吵架之后，我会长时间担心关系就此结束而无法平静。","独处久了，我会觉得孤单，好像被抛弃了。","即使联系变少，我也会放心地认为没事，平静等待。","即使不去确认，我也相信对方在乎我。","即使争吵，我也相信我们的关系最终没事。","对方和别人相处愉快时，我不会太嫉妒或不安。","我能毫无不安地享受独处时间。","我大体上相信自己值得被爱。","在关系中感到不安时，我通常能自己平复心情。","遇到难事，我更愿意自己解决，而不是依赖对方。","对方靠得太近时，我会觉得有压力，想拉开距离。","展露内心或脆弱的一面让我不自在。","即使在恋爱中，我也认为必须坚决守住自己的领域。","面对情感表达很多的人，我不知如何是好。","依赖某人让我觉得失去自由，所以有所抗拒。","关系一认真起来，我反而会冷淡下来或想逃开。","难过时向对方倾诉并依靠对方，对我来说很自然。","和亲近的人分享心事，让我轻松愉快。","我想要彼此分享日常一切的关系。","我相信即使展露脆弱，对方也会接纳我。","我觉得彼此依靠的关系反而更稳定。","恋人想和我更亲近时，我会很开心。","关系越深，我通常越觉得自在。"],
ja:["返信がいつもより遅いと不安になり、何度もスマホを確認してしまう。","相手が自分から離れていくのではと心配になることが多い。","相手の表情や口調が少し変わるだけで、自分が何かしたのかと考えてしまう。","愛されていると頻繁に言葉で聞かないと安心できない。","関係が深まるほど、自分のほうが相手より好きなのではと不安になる。","ケンカの後は、関係が終わるのではと長く落ち着かない。","一人の時間が長いと、寂しくて見捨てられたような気分になる。","連絡が減っても、特に何もないだろうと落ち着いて待てる。","わざわざ確かめなくても、相手が自分を大切にしていると信じられる。","言い争っても、私たちの関係は結局大丈夫だと思える。","相手が他の人と楽しく過ごしていても、嫉妬や不安はあまり感じない。","一人の時間も、不安なく楽しめる。","自分は愛されるに値する人間だという確信がおおむねある。","関係の中で不安になっても、自分で気持ちを落ち着かせられるほうだ。","つらいことがあっても、相手に頼るより一人で解決するほうが楽だ。","相手が近づきすぎると負担に感じ、距離を置きたくなる。","本音や弱い部分を見せるのは居心地が悪い。","恋愛していても、自分だけの領域は徹底して守るべきだと思う。","感情表現の多い人を前にすると、どう接すればいいか戸惑う。","誰かに頼ると自由を失う気がして、ためらってしまう。","関係が真剣になりそうになると、かえって冷めたり逃げたくなったりする。","つらいとき、相手に打ち明けて頼るのは自然なことだ。","親しい人と気持ちを分かち合う時間は、心地よくて好きだ。","日常のあらゆることを分かち合える関係を望む。","弱い姿を見せても、相手は受け止めてくれると信じている。","互いに頼り合う関係のほうが、むしろ安定すると感じる。","恋人がもっと近づきたいと言ってくれると嬉しい。","関係が深まるほど、より安心できるほうだ。"]};
const COL=[{lo:["#9be5d4","#52c7b0","#2a9e8a"],hi:["#f7d3a0","#f0b46c","#d98a2b"]},{lo:["#9be5d4","#52c7b0","#2a9e8a"],hi:["#b3cff7","#6fa3ee","#3a72cc"]}],TC=["#52c7b0","#f0b46c","#6fa3ee","#a98cf0"];
const L5=v=>{const d=Math.abs(v-50);return d<8?0:d<22?1:d<36?2:3},cl=(i,v)=>{const l=L5(v);return l?COL[i][v>50?"hi":"lo"][l-1]:"#cfd3d8"},tx=(i,v)=>v>50?(i?"#8fb8f5":"#f6c58a"):"#7fdcc8",tp=n=>(n[0]>50?1:0)+(n[1]>50?2:0);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function persist(){try{localStorage.setItem("bond_progress1",JSON.stringify({qs,ans,idx,startAt}))}catch(e){}}
function tick(){clearInterval(ti);ti=setInterval(()=>{const s=Math.floor((Date.now()-startAt)/1000);$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000)}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0)}
function start(){track("test_start");$("sharedBanner").classList.remove("show");qs=shuffle(Array.from({length:28},(_,i)=>i)).map(i=>({i,ax:i<14?0:1,rev:i%14>=7}));ans=Array(28).fill(null);idx=0;startAt=Date.now();persist();show("test");renderQ();tick()}
function renderQ(){const q=qs[idx];$("count").textContent=`${idx+1} / 28`;$("qnum").textContent=`QUESTION ${String(idx+1).padStart(2,"0")}`;$("question").textContent=QT[lang][q.i];$("progress").style.width=((idx+1)/28*100)+"%";$("prev").disabled=idx===0;$("next").textContent=idx===27?UI[lang].fin:UI[lang].next;
$("choices").innerHTML=SC[lang].map((t,i)=>`<div class="choice"><input ${ans[idx]===i+1?"checked":""} type="radio" name="a" id="c${i}" value="${i+1}"><label for="c${i}">${t}</label></div>`).join("")}
$("choices").addEventListener("click",e=>{const lab=e.target.closest(".choice");if(!lab)return;e.preventDefault();const inp=lab.querySelector("input");ans[idx]=+inp.value;persist();document.querySelectorAll("#choices input").forEach(x=>x.checked=(x===inp));
if(idx<27&&!window.advLock){window.advLock=true;setTimeout(()=>{window.advLock=false;if(idx<27){idx++;persist();renderQ()}},100)}});
function nextQ(){if(ans[idx]==null)return;if(idx<27){idx++;persist();renderQ()}else finish()}
function prevQ(){if(idx>0){idx--;renderQ()}}
