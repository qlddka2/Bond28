const SECI={ko:["두 가지의 공통점이나 관계를 가장 잘 설명하는 것을 고르세요.","위쪽 도형을 돌려서(뒤집지 않고) 똑같이 만들 수 있는 것을 고르세요.","빈칸에 들어갈 규칙에 맞는 것을 고르세요. 도형과 숫자 문제가 섞여 있어요.","숫자가 잠깐 나타났다 사라집니다. 기억한 뒤 지시에 맞게 배열한 것을 고르세요.","제한 시간 45초. 왼쪽 기호 중 하나라도 오른쪽 줄에 있으면 ‘있음’, 없으면 ‘없음’을 최대한 빠르게 누르세요. 틀리면 감점됩니다."],
en:["Choose the option that best explains what the two have in common, or how they relate.","Choose the shape you get by rotating the top shape (not flipping it).","Choose what fits the blank. Shape and number puzzles are mixed.","Digits appear briefly, then vanish. Remember them and choose the right arrangement.","45 seconds. If either symbol on the left appears in the row on the right, press Yes; otherwise No. Be fast. Wrong answers cost points."],
zh:["选出最能说明两者共同点或关系的选项。","选出把上方图形旋转（不翻转）后得到的图形。","选出符合规则、可填入空白处的选项。图形题和数字题混合出现。","数字会短暂出现后消失。记住后选出按要求排列的结果。","限时45秒。左边符号只要有一个出现在右边一行里就按“有”，否则按“没有”。越快越好，答错会扣分。"],
ja:["2つの共通点や関係を最もよく説明するものを選んでください。","上の図形を回転させて（裏返さずに）作れるものを選んでください。","空欄に入るルールに合うものを選んでください。図形と数字の問題が混ざっています。","数字が一瞬だけ表示されて消えます。覚えて、指示どおりに並べたものを選んでください。","制限時間45秒。左の記号のどちらかが右の列にあれば「ある」、なければ「ない」をできるだけ速く押してください。間違えると減点です。"]};
const VC={ko:[["‘사과’와 ‘바나나’의 공통점은?","둘 다 과일이다","둘 다 채소이다","둘 다 곡식이다","둘 다 견과류이다"],["‘시계’와 ‘온도계’의 공통점은?","무언가를 재는 도구이다","집안 가구이다","요리 재료이다","옷의 종류이다"],["‘민주주의’와 ‘군주제’의 공통점은?","나라를 다스리는 방식이다","경제 지표이다","기후의 종류이다","예술 사조이다"],["‘모호하다’와 가장 가까운 뜻은?","뜻이 분명하지 않다","태도가 단호하다","행동이 신중하다","표현이 과장되다"],["‘법’과 ‘도덕’의 공통점은?","사람의 행동을 이끄는 사회적 규범이다","국가가 강제하는 처벌 규칙이다","종교에서 비롯된 가르침이다","헌법에 적혀 있는 조항이다"],["‘거울’과 ‘메아리’의 공통점은?","받은 것을 되돌려 보낸다","둘 다 소리를 낸다","둘 다 빛을 낸다","둘 다 자연에서만 생긴다"],["‘시(詩)’와 ‘교향곡’의 공통점은?","형식을 빌려 감정과 생각을 표현하는 예술이다","둘 다 악보에 적혀 있다","둘 다 소리 내어 읽어야 한다","둘 다 길수록 좋은 작품이다"],["‘댐’과 ‘퓨즈’의 공통점은?","흐름을 제한해 더 큰 피해를 막는다","둘 다 전기와 관련 있다","둘 다 물을 저장한다","둘 다 한 번 쓰면 못 쓴다"]],
en:[["What do ‘apple’ and ‘banana’ have in common?","Both are fruits","Both are vegetables","Both are grains","Both are nuts"],["What do a ‘clock’ and a ‘thermometer’ have in common?","Both are instruments for measuring","Both are furniture","Both are cooking ingredients","Both are clothing"],["What do ‘democracy’ and ‘monarchy’ have in common?","Both are ways of governing a country","Both are economic indicators","Both are types of climate","Both are art movements"],["Which is closest in meaning to ‘ambiguous’?","Unclear in meaning","Firm in attitude","Careful in action","Exaggerated in expression"],["What do ‘law’ and ‘morality’ have in common?","Both are social norms guiding behavior","Both are punishment rules enforced by the state","Both are teachings from religion","Both are clauses of a constitution"],["What do a ‘mirror’ and an ‘echo’ have in common?","Both send back what they receive","Both make sound","Both give off light","Both only occur in nature"],["What do a ‘poem’ and a ‘symphony’ have in common?","Both use form to express feeling and ideas","Both are written in musical notation","Both must be read aloud","Both are better the longer they are"],["What do a ‘dam’ and a ‘fuse’ have in common?","Both limit a flow to prevent bigger damage","Both involve electricity","Both store water","Both can only be used once"]],
zh:[["“苹果”和“香蕉”的共同点是？","都是水果","都是蔬菜","都是谷物","都是坚果"],["“钟表”和“温度计”的共同点是？","都是用来测量的工具","都是家具","都是烹饪食材","都是衣物"],["“民主制”和“君主制”的共同点是？","都是治理国家的方式","都是经济指标","都是气候类型","都是艺术流派"],["与“含糊”意思最接近的是？","意思不清楚","态度坚决","行事谨慎","表达夸张"],["“法律”和“道德”的共同点是？","都是引导人们行为的社会规范","都是国家强制执行的惩罚规则","都是源自宗教的教义","都是宪法中的条文"],["“镜子”和“回声”的共同点是？","都把接收到的东西反射回去","都会发出声音","都会发光","都只出现在自然界"],["“诗”和“交响曲”的共同点是？","都借助形式表达情感与思想","都写在乐谱上","都必须朗读出声","都是越长越好"],["“水坝”和“保险丝”的共同点是？","都限制流动以避免更大损失","都与电有关","都能储水","都只能用一次"]],
ja:[["「りんご」と「バナナ」の共通点は？","どちらも果物","どちらも野菜","どちらも穀物","どちらもナッツ"],["「時計」と「温度計」の共通点は？","どちらも何かを測る道具","どちらも家具","どちらも料理の材料","どちらも衣類"],["「民主主義」と「君主制」の共通点は？","どちらも国の統治のしかた","どちらも経済指標","どちらも気候の種類","どちらも芸術の潮流"],["「曖昧」に最も近い意味は？","はっきりしない","態度が断固としている","行動が慎重である","表現が大げさである"],["「法」と「道徳」の共通点は？","どちらも行動を導く社会的規範","どちらも国家が強制する罰則","どちらも宗教由来の教え","どちらも憲法の条文"],["「鏡」と「こだま」の共通点は？","どちらも受けたものを跳ね返す","どちらも音を出す","どちらも光を出す","どちらも自然にしかない"],["「詩」と「交響曲」の共通点は？","どちらも形式を借りて感情や考えを表す","どちらも楽譜に書かれる","どちらも声に出して読む","どちらも長いほど良い"],["「ダム」と「ヒューズ」の共通点は？","どちらも流れを制限して大きな被害を防ぐ","どちらも電気に関係する","どちらも水をためる","どちらも一度しか使えない"]]};

const TY={ko:[["언어·개념형","사전 속에 사는 탐험가","🦉 지혜로운 올빼미","단어와 개념 사이의 관계를 빠르게 잡아내고, 복잡한 내용을 말로 쉽게 풀어냅니다. 읽고 설명하고 설득하는 일에서 힘이 나요.","말로 정리되지 않는 감각(도형, 숫자, 직관)을 가볍게 넘기기 쉬워요. 말이 앞서 행동이 늦어지지 않게, 가끔은 직접 손으로 해보세요."],
["공간·설계형","상상으로 먼저 짓는 건축가","🦫 부지런한 비버","눈에 보이는 형태를 머릿속에서 돌리고 맞추는 감각이 좋습니다. 지도, 도면, 조립, 디자인에서 감이 빨라요.","‘보면 아는 것’을 말로 설명하는 데 시간이 걸릴 수 있어요. 설명할 땐 스케치를 곁들이면 훨씬 잘 전달됩니다."],
["추론·패턴형","낯선 문제의 규칙을 캐내는 탐정","🦊 눈 밝은 여우","처음 보는 문제에서도 규칙과 관계를 찾아냅니다. 새로운 상황에 빨리 적응하고, 막힌 문제의 돌파구를 잘 찾아요.","규칙이 없는 곳에서도 패턴을 찾으려다 과하게 해석할 수 있어요. 가끔은 ‘그냥 우연’일 수도 있다는 여지를 남겨 두세요."],
["기억·동시처리형","머릿속에서 여러 개를 굴리는 저글러","🐙 팔 많은 문어","정보를 잠깐 붙잡고 동시에 다루는 힘이 좋아요. 암산, 대화 흐름 따라가기, 여러 일 병행에 강합니다.","머릿속에만 담아 두다 과부하가 올 수 있어요. 메모와 체크리스트를 쓰면 훨씬 여유로워집니다."],
["속도·집중형","보자마자 반응하는 스피드러너","🐆 날쌘 치타","단순한 정보를 빠르고 정확하게 훑고 처리합니다. 반복 업무, 확인 작업, 즉각적인 판단에서 효율이 높아요.","속도가 앞서 세부를 놓칠 수 있어요. 중요한 일은 한 번 더 확인하는 습관을 들이면 강점이 더 빛납니다."],
["균형 잡힌 만능형","한쪽에 쏠리지 않는 올라운더","🐬 영리한 돌고래","특정 영역에 크게 치우치지 않은 고른 모양입니다. 어떤 과제든 부담 없이 시작하고, 상황에 맞춰 쓰는 능력을 바꿔 가며 풀어갈 수 있어요.","뚜렷한 ‘한 방’이 없다고 느낄 수 있어요. 가장 재미있는 영역 하나를 골라 깊게 파 보면 강점이 선명해집니다."]],
en:[["Words & Concepts","The explorer who lives in the dictionary","🦉 Wise owl","You quickly see how words and ideas relate, and explain complex things simply. Reading, explaining and persuading are where you shine.","You may skim past things words can't capture (shapes, numbers, hunches). Don't let talking outrun doing, so sometimes try it by hand."],
["Space & Design","The architect who builds in imagination first","🦫 Busy beaver","You're good at rotating and fitting forms in your head. Maps, blueprints, assembly and design come quickly to you.","Explaining what you ‘just see’ can take time. Adding a quick sketch will carry your ideas much further."],
["Reasoning & Patterns","The detective who cracks unfamiliar rules","🦊 Sharp-eyed fox","You find rules and relationships even in problems you've never seen. You adapt fast and find breakthroughs when stuck.","You may over-read patterns where none exist. Leave room for ‘maybe it's just chance’ now and then."],
["Memory & Multitasking","The juggler keeping many things in mind","🐙 Many-armed octopus","You hold and work with information at the same time. Mental math, following conversations and juggling tasks come naturally.","Keeping everything in your head can overload you. Notes and checklists will give you breathing room."],
["Speed & Focus","The speedrunner who reacts on sight","🐆 Swift cheetah","You scan and process simple information fast and accurately. Repetitive work, checking and instant judgment are your zone.","Speed can outrun detail. A habit of one more check on important things makes the strength shine."],
["Balanced All-rounder","The all-rounder who doesn't lean one way","🐬 Clever dolphin","Your shape is even, not leaning hard toward any area. You can start any task comfortably and switch which ability you use as needed.","You may feel you lack one standout skill. Pick the area you enjoy most and go deep, and your strength will sharpen."]],
zh:[["语言·概念型","住在词典里的探险家","🦉 睿智的猫头鹰","能很快抓住词语与概念之间的关系，把复杂内容讲得通俗易懂。阅读、解释、说服时最有力量。","容易轻视无法用语言表达的感觉（图形、数字、直觉）。别让说得多于做得，偶尔亲手试一试。"],
["空间·设计型","先在想象中建造的建筑师","🦫 勤劳的海狸","擅长在脑中旋转、拼合看得见的形状。地图、图纸、组装和设计上上手很快。","“一看就懂”的东西可能要花时间才能讲清楚。配上草图，表达会好得多。"],
["推理·规律型","破解陌生规则的侦探","🦊 眼尖的狐狸","面对初见的问题也能找出规则与关系。适应新情境快，卡住时善于找到突破口。","有时会在没有规律的地方过度解读。偶尔留一点“也许只是巧合”的余地。"],
["记忆·多任务型","脑中同时转动多件事的杂耍家","🐙 多臂章鱼","能暂时记住信息并同时处理。心算、跟上对话、多任务并行都很在行。","只靠脑子记容易过载。用便签和清单会轻松很多。"],
["速度·专注型","一看到就反应的速度选手","🐆 敏捷的猎豹","能又快又准地扫描、处理简单信息。重复性工作、核对、即时判断效率很高。","速度太快可能漏掉细节。重要的事养成再确认一次的习惯，优势会更闪亮。"],
["均衡全能型","不偏向任何一边的全能选手","🐬 聪明的海豚","形状均匀，没有明显偏向某一领域。任何任务都能从容开始，并按情况切换使用的能力。","可能觉得没有特别突出的“一招”。选一个最有兴趣的领域深挖，优势会变得鲜明。"]],
ja:[["言語・概念タイプ","辞書に住む探検家","🦉 賢いフクロウ","言葉や概念の関係をすばやくつかみ、複雑な内容をやさしく言葉にできます。読む・説明する・説得するときに力を発揮します。","言葉にしにくい感覚（図形・数字・直感）を軽く流しがち。言葉が先行して動きが遅れないよう、ときには手を動かしてみましょう。"],
["空間・設計タイプ","想像の中で先に建てる建築家","🦫 働き者のビーバー","目に見える形を頭の中で回したり合わせたりする感覚が優れています。地図・図面・組み立て・デザインで勘が冴えます。","「見ればわかる」ことを言葉で説明するのに時間がかかることも。スケッチを添えるとぐっと伝わります。"],
["推理・パターンタイプ","未知のルールを暴く探偵","🦊 目ざといキツネ","初めて見る問題でもルールや関係を見つけ出します。新しい状況への適応が早く、行き詰まりの突破口も見つけます。","ルールのないところにまでパターンを探して深読みすることも。ときには「ただの偶然かも」と余地を残しましょう。"],
["記憶・同時処理タイプ","頭の中で複数を回すジャグラー","🐙 腕の多いタコ","情報を一時的に保持しながら同時に扱う力があります。暗算、会話の流れの把握、複数作業の並行が得意です。","頭の中だけで抱えると負荷がかかります。メモやチェックリストを使うと楽になります。"],
["スピード・集中タイプ","見た瞬間に反応するスピードランナー","🐆 俊敏なチーター","単純な情報を速く正確に見て処理します。反復作業、確認、即断の場面で効率が高いタイプです。","速さが先行して細部を見落とすことも。大事なことはもう一度確認する習慣で強みがさらに輝きます。"],
["バランス万能タイプ","どちらにも偏らないオールラウンダー","🐬 賢いイルカ","特定の領域に大きく偏らない、均整のとれた形です。どんな課題も気負わず始められ、状況に合わせて使う力を切り替えられます。","「これだ」という決め手がないと感じるかも。いちばん楽しい領域をひとつ選んで深めると、強みがはっきりします。"]]};

/* ---------- polyomino (시공간) ---------- */
const norm=c=>{const mx=Math.min(...c.map(p=>p[0])),my=Math.min(...c.map(p=>p[1]));return c.map(p=>[p[0]-mx,p[1]-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};

const NB=[[1,0],[-1,0],[0,1],[0,-1]];
function connected(c){const s=new Set(c.map(p=>p.join(","))),st=[c[0]],seen=new Set([c[0].join(",")]);while(st.length){const p=st.pop();NB.forEach(d=>{const q=[p[0]+d[0],p[1]+d[1]],k=q.join(",");if(s.has(k)&&!seen.has(k)){seen.add(k);st.push(q)}})}return seen.size===c.length}
function genVS(k){const N=[5,5,6,6,7,7,8,8][k],nm=[1,1,2,2,3,3,3,3][k];
 for(let a=0;a<4000;a++){const R=rng(1000+k*131+a);let c=[[0,0]];
  while(c.length<N){const p=c[Math.floor(R()*c.length)],d=NB[Math.floor(R()*4)],q=[p[0]+d[0],p[1]+d[1]];if(!c.some(x=>x[0]===q[0]&&x[1]===q[1]))c.push(q)}
  c=norm(c);const w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1;if(w>4||h>4||Math.min(w,h)<2||(N>=7&&Math.min(w,h)<3))continue;
  const rk=rotsK(c),mk=key(mir(c));if(rk.includes(mk))continue;
  const used=new Set(rk);const cor=rotN(c,1+Math.floor(R()*3));if(key(cor)===key(c))continue;
  const opts=[cor];used.add(key(cor));
  const mrots=[0,1,2,3].map(n=>rotN(mir(c),n));let mi=shuffle(mrots.slice()).slice(0,nm);
  let ok=true;const dis=[];mi.forEach(m=>{if(!used.has(key(m))){used.add(key(m));dis.push(m)}});
  let tries=0;while(dis.length<3&&tries++<200){const m=c.map(p=>p.slice()),i=Math.floor(R()*m.length),rest=m.filter((_,j)=>j!==i);if(!connected(rest))continue;const p=rest[Math.floor(R()*rest.length)],d=NB[Math.floor(R()*4)],q=[p[0]+d[0],p[1]+d[1]];if(rest.some(x=>x[0]===q[0]&&x[1]===q[1]))continue;const nc=norm(rest.concat([q]));if(!connected(nc))continue;const kk=rotsK(nc).concat([key(mir(nc))]);if(kk.some(z=>used.has(z)))continue;rotsK(nc).forEach(z=>used.add(z));used.add(key(nc));dis.push(nc)}
  if(dis.length<3)continue;return{stem:c,v:[cor,...dis.slice(0,3)]}}

function polySvg(c,u){const w=Math.max(...c.map(p=>p[0]))+1,h=Math.max(...c.map(p=>p[1]))+1,V=5*u,ox=(V-w*u)/2,oy=(V-h*u)/2;return `<svg viewBox="0 0 ${V} ${V}">${c.map(p=>`<rect x="${ox+p[0]*u+1}" y="${oy+p[1]*u+1}" width="${u-2}" height="${u-2}" rx="3" fill="#2dd4bf" stroke="#0a0f1d" stroke-width="1"/>`).join("")}</svg>`}
/* ---------- matrices / series (유동추론) ---------- */
function shp(s,cx,cy,z,f){const fill=f==0?"#e9eef5":f==1?"none":"url(#hp)",st='stroke="#e9eef5" stroke-width="2.4"';
 if(s==0)return `<circle cx="${cx}" cy="${cy}" r="${z}" fill="${fill}" ${st}/>`;

const MAT=[(r,c)=>({s:(r+c)%3,n:1,f:0}),(r,c)=>({s:r,n:c+1,f:0}),(r,c)=>({s:(r+c)%3,n:r+1,f:c}),(r,c)=>({s:(r+2*c)%3,n:((r+c)%3)+1,f:r===c?1:0})];
function genMat(mi){const f=MAT[mi],ans=f(2,2),cand=[];
 for(let s=0;s<3;s++)if(s!==ans.s)cand.push({...ans,s});for(let n=1;n<=3;n++)if(n!==ans.n)cand.push({...ans,n});for(let q=0;q<3;q++)if(q!==ans.f)cand.push({...ans,f:q});

const SER=[["2, 4, 8, 16, ?",[32,24,30,34]],["3, 4, 6, 9, 13, ?",[18,17,19,21]],["7, 10, 9, 12, 11, ?",[14,13,15,16]],["1, 4, 2, 8, 6, 24, ?",[22,20,28,30]]];
/* ---------- working memory ---------- */
function genWM(k){const L=[4,4,5,5,6,6,7,7][k],mode=k%2,R=rng(7000+k*17);for(;;){const d=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,L);const sorted=d.slice().sort((a,b)=>a-b),want=mode?d.slice().reverse():sorted;const same=a=>a.join()===want.join();if(same(d))continue;
 const sw=(a,i)=>{const b=a.slice();[b[i],b[i+1]]=[b[i+1],b[i]];return b};const set=new Map();set.set(want.join(),want);
 const cands=[sw(want,0),sw(want,L-2),sw(want,1),mode?sorted:d,sw(want,Math.floor(L/2))];
 for(const c of cands){if(!set.has(c.join()))set.set(c.join(),c);if(set.size===4)break}
 if(set.size<4)continue;const v=[...set.values()].slice(0,4);v.sort((a,b)=>(a.join()===want.join()?-1:0)-(b.join()===want.join()?-1:0));return{digits:d,mode,v}}}

function build(){const it=[],K=8;

 for(let k=0;k<K;k++){const g=genVS(k);it.push({sec:1,k,w:W[k],o:shuffle([0,1,2,3]),stem:g.stem,v:g.v})}
